version: '3.8'

services:
  saas-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - NODE_ENV=production
    restart: always

  saas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3009:80"
    depends_on:
      - saas-backend
    restart: always
